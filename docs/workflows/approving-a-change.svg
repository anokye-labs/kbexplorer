eight="700" letter-spacing="2">HOST · SYSTEMS OF RECORD</text><path class="ed0" d="M309.0,455.0 L324.0,455.0" fill="none" stroke="#7c3aed" stroke-width="2.2" stroke-opacity="0.75" marker-end="url(#m-kbx)" stroke-dasharray="17" style="--len:17"/><path class="ed1" d="M440.0,501.0 L440.0,666.0 Q440.0,680.0 454.0,680.0 L564.0,680.0" fill="none" stroke="#7c3aed" stroke-width="2.2" stroke-opacity="0.75" marker-end="url(#m-kbx)" stroke-dasharray="333" style="--len:333"/><path class="ed2" d="M680.0,634.0 L680.0,469.0 Q680.0,455.0 694.0,455.0 L804.0,455.0" fill="none" stroke="#64748b" stroke-width="2.2" stroke-opacity="0.75" marker-end="url(#m-host)" stroke-dasharray="333" style="--len:333"/><path class="ed3" d="M920.0,417.0 L920.0,219.0 Q920.0,205.0 934.0,205.0 L1044.0,205.0" fill="none" stroke="#7c3aed" stroke-width="2.2" stroke-opacity="0.75" marker-end="url(#m-kbx)" stroke-dasharray="366" style="--len:366"/><path class="ed4" d="M1160.0,243.0 L1160.0,666.0 Q1160.0,680.0 1174.0,680.0 L1284.0,680.0" fill="none" stroke="#0d9488" stroke-width="2.2" stroke-opacity="0.75" marker-end="url(#m-human)" stroke-dasharray="591" style="--len:591"/><path class="edlp0" d="M1051.0,205.0 C901.0,205.0 260.0,331.0 200.0,401.0" fill="none" stroke="#7c3aed" stroke-width="2" stroke-opacity="0.6" stroke-dasharray="6 5" marker-end="url(#m-kbx)"/><text x="625.5" y="179.0" text-anchor="middle" fill="#7c3aed" font-size="12" font-style="italic" paint-order="stroke" stroke="#ffffff" stroke-width="4">send back — revise the proposal</text><g class="st0"><rect x="91.0" y="409.0" width="218.0" height="92" rx="10" fill="#ffffff" stroke="#6d28d9" stroke-opacity="0.5" stroke-width="1.6" filter="url(#ss)"/><circle cx="91.0" cy="409.0" r="12.5" fill="url(#node)"/><text x="91.0" y="413.5" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">1</text><g fill="none" stroke="#6d28d9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform="translate(279.0,419.0) scale(0.8)"><path d="M7,3.5 h7 l4,4 v13 h-11 z"/><path d="M14,3.5 v4 h4"/><line x1="9.5" y1="12" x2="15.5" y2="12"/><line x1="9.5" y1="15.5" x2="15.5" y2="15.5"/></g><text x="105.0" y="435.0" fill="#111827" font-size="14" font-weight="600">A proposal is staged</text><text x="105.0" y="455.0" fill="#6b7280" font-size="12">preview, then apply_changes</text><text x="105.0" y="471.0" fill="#6b7280" font-size="12">— a consent-gated change-</text><text x="105.0" y="487.0" fill="#6b7280" font-size="12">set, not a write</text></g><g class="st1"><rect x="331.0" y="409.0" width="218.0" height="92" rx="10" fill="#ffffff" stroke="#6d28d9" stroke-opacity="0.5" stroke-width="1.6" filter="url(#ss)"/><circle cx="331.0" cy="409.0" r="12.5" fill="url(#node)"/><text x="331.0" y="413.5" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">2</text><g fill="none" stroke="#6d28d9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform="translate(519.0,419.0) scale(0.8)"><path d="M12,3.2 l7,2.8 v6 c0,4.4 -3,7.4 -7,8.8 c-4,-1.4 -7,-4.4 -7,-8.8 v-6 z"/><path d="M9,11.5 l2.1,2.1 4,-4.4"/></g><text x="345.0" y="435.0" fill="#111827" font-size="14" font-weight="600">Provenance attached</text><text x="345.0" y="455.0" fill="#6b7280" font-size="12">stampProvenance: generator,</text><text x="345.0" y="471.0" fill="#6b7280" font-size="12">source hash, extraction</text><text x="345.0" y="487.0" fill="#6b7280" font-size="12">intermediate</text></g><g class="st2"><rect x="571.0" y="634.0" width="218.0" height="92" rx="10" fill="#ffffff" stroke="#475569" stroke-opacity="0.5" stroke-width="1.6" filter="url(#ss)"/><circle cx="571.0" cy="634.0" r="12.5" fill="url(#node)"/><text x="571.0" y="638.5" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">3</text><g fill="none" stroke="#475569" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform="translate(759.0,644.0) scale(0.8)"><circle cx="6.5" cy="6" r="2.3"/><circle cx="6.5" cy="18" r="2.3"/><circle cx="17.5" cy="18" r="2.3"/><line x1="6.5" y1="8.3" x2="6.5" y2="15.7"/><path d="M10.5,6 h3 a4,4 0 0 1 4,4 v5.7"/></g><text x="585.0" y="660.0" fill="#111827" font-size="14" font-weight="600">PR opened — refs #N</text><text x="585.0" y="680.0" fill="#6b7280" font-size="12">create_pr affordance;</text><text x="585.0" y="696.0" fill="#6b7280" font-size="12">every change traces to</text><text x="585.0" y="712.0" fill="#6b7280" font-size="12">a typed issue</text></g><g class="st3"><rect x="811.0" y="417.0" width="218.0" height="76" rx="10" fill="#ffffff" stroke="#6d28d9" stroke-opacity="0.5" stroke-width="1.6" filter="url(#ss)"/><circle cx="811.0" cy="417.0" r="12.5" fill="url(#node)"/><text x="811.0" y="421.5" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">4</text><g fill="none" stroke="#6d28d9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform="translate(999.0,427.0) scale(0.8)"><circle cx="12" cy="12" r="3.2"/><path d="M12,4.5 v2.3 M12,17.2 v2.3 M4.5,12 h2.3 M17.2,12 h2.3 M6.7,6.7 l1.6,1.6 M15.7,15.7 l1.6,1.6 M17.3,6.7 l-1.6,1.6 M8.3,15.7 l-1.6,1.6"/></g><text x="825.0" y="443.0" fill="#111827" font-size="14" font-weight="600">Validation gates</text><text x="825.0" y="463.0" fill="#6b7280" font-size="12">required checks: audit, drift</text><text x="825.0" y="479.0" fill="#6b7280" font-size="12">gates, linked issue, title</text></g><g class="st4"><rect x="1051.0" y="167.0" width="218.0" height="76" rx="10" fill="#ffffff" stroke="#0d9488" stroke-opacity="0.5" stroke-width="1.6" filter="url(#ss)"/><circle cx="1051.0" cy="167.0" r="12.5" fill="url(#node)"/><text x="1051.0" y="171.5" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">5</text><g fill="none" stroke="#0d9488" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform="translate(1239.0,177.0) scale(0.8)"><path d="M2.8,12 C5.3,7.3 8.8,5.2 12,5.2 s6.7,2.1 9.2,6.8 C18.7,16.7 15.2,18.8 12,18.8 s-6.7,-2.1 -9.2,-6.8 z"/><circle cx="12" cy="12" r="2.6"/></g><text x="1065.0" y="193.0" fill="#111827" font-size="14" font-weight="600">Human review gate</text><text x="1065.0" y="213.0" fill="#6b7280" font-size="12">rendered delta + provenance;</text><text x="1065.0" y="229.0" fill="#6b7280" font-size="12">conflation: always a human</text></g><g class="st5"><rect x="1291.0" y="642.0" width="218.0" height="76" rx="10" fill="#ffffff" stroke="#475569" stroke-opacity="0.5" stroke-width="1.6" filter="url(#ss)"/><circle cx="1291.0" cy="642.0" r="12.5" fill="url(#node)"/><text x="1291.0" y="646.5" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">6</text><g fill="none" stroke="#475569" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform="translate(1479.0,652.0) scale(0.8)"><circle cx="12" cy="12" r="8.6"/><path d="M8,12.4 l2.8,2.8 5.3,-5.9"/></g><text x="1305.0" y="668.0" fill="#111827" font-size="14" font-weight="600">Merge &amp; close issue</text><text x="1305.0" y="688.0" fill="#6b7280" font-size="12">closure cites the now-current</text><text x="1305.0" y="704.0" fill="#6b7280" font-size="12">repo state as evidence</text></g><text x="800" y="862" text-anchor="middle" fill="#94a3b8" font-size="14">A change is a reviewable proposal routed to the right authority — never a silent clobber.</text></svg>