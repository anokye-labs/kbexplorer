<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" role="img" aria-labelledby="t d">
<title id="t">Creating a kbx dataset</title>
<desc id="d">A person chooses a starting point and runs the guided init; the kbx genesis state machine collects five choices, generates the graph, commits the scaffold to git, and the result is verified and explored.</desc>
<defs>
<linearGradient id="node" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
<linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#faf5ff"/><stop offset="1" stop-color="#f3f0ff"/></linearGradient>
<filter id="cs" x="-4%" y="-12%" width="108%" height="128%"><feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#6d28d9" flood-opacity="0.12"/></filter>
<filter id="ss" x="-12%" y="-24%" width="124%" height="156%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/></filter>
<marker id="m-human" viewBox="0 0 10 10" refX="6.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5,1 L8.5,5 L1.5,9" fill="none" stroke="#0d9488" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="m-kbx" viewBox="0 0 10 10" refX="6.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5,1 L8.5,5 L1.5,9" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="m-host" viewBox="0 0 10 10" refX="6.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5,1 L8.5,5 L1.5,9" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
g[class^="st"],path[class^="ed"]{animation-duration:16s;animation-timing-function:ease-in-out;animation-iteration-count:infinite}
g[class^="st"]{transform-box:fill-box;transform-origin:center}
@keyframes st0{0%{opacity:0;transform:scale(.6)}2.0%{opacity:0;transform:scale(.6)}4.2%{opacity:1;transform:scale(1)}84%{opacity:1;transform:scale(1)}92%{opacity:0;transform:scale(.6)}100%{opacity:0;transform:scale(.6)}}
.st0{animation-name:st0}
@keyframes st1{0%{opacity:0;transform:scale(.6)}14.0%{opacity:0;transform:scale(.6)}16.2%{opacity:1;transform:scale(1)}84%{opacity:1;transform:scale(1)}92%{opacity:0;transform:scale(.6)}100%{opacity:0;transform:scale(.6)}}
.st1{animation-name:st1}
@keyframes st2{0%{opacity:0;transform:scale(.6)}26.0%{opacity:0;transform:scale(.6)}28.2%{opacity:1;transform:scale(1)}84%{opacity:1;transform:scale(1)}92%{opacity:0;transform:scale(.6)}100%{opacity:0;transform:scale(.6)}}
.st2{animation-name:st2}
@keyframes st3{0%{opacity:0;transform:scale(.6)}38.0%{opacity:0;transform:scale(.6)}40.2%{opacity:1;transform:scale(1)}84%{opacity:1;transform:scale(1)}92%{opacity:0;transform:scale(.6)}100%{opacity:0;transform:scale(.6)}}
.st3{animation-name:st3}
@keyframes st4{0%{opacity:0;transform:scale(.6)}50.0%{opacity:0;transform:scale(.6)}52.2%{opacity:1;transform:scale(1)}84%{opacity:1;transform:scale(1)}92%{opacity:0;transform:scale(.6)}100%{opacity:0;transform:scale(.6)}}
.st4{animation-name:st4}
@keyframes st5{0%{opacity:0;transform:scale(.6)}62.0%{opacity:0;transform:scale(.6)}64.2%{opacity:1;transform:scale(1)}84%{opacity:1;transform:scale(1)}92%{opacity:0;transform:scale(.6)}100%{opacity:0;transform:scale(.6)}}
.st5{animation-name:st5}
@keyframes ed0{0%{stroke-dashoffset:var(--len);opacity:0}8.0%{stroke-dashoffset:var(--len);opacity:0}8.4%{opacity:1}11.0%{stroke-dashoffset:0;opacity:1}84%{stroke-dashoffset:0;opacity:1}92%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:var(--len);opacity:0}}
.ed0{animation-name:ed0}
@keyframes ed1{0%{stroke-dashoffset:var(--len);opacity:0}20.0%{stroke-dashoffset:var(--len);opacity:0}20.4%{opacity:1}23.0%{stroke-dashoffset:0;opacity:1}84%{stroke-dashoffset:0;opacity:1}92%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:var(--len);opacity:0}}
.ed1{animation-name:ed1}
@keyframes ed2{0%{stroke-dashoffset:var(--len);opacity:0}32.0%{stroke-dashoffset:var(--len);opacity:0}32.4%{opacity:1}35.0%{stroke-dashoffset:0;opacity:1}84%{stroke-dashoffset:0;opacity:1}92%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:var(--len);opacity:0}}
.ed2{animation-name:ed2}
@keyframes ed3{0%{stroke-dashoffset:var(--len);opacity:0}44.0%{stroke-dashoffset:var(--len);opacity:0}44.4%{opacity:1}47.0%{stroke-dashoffset:0;opacity:1}84%{stroke-dashoffset:0;opacity:1}92%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:var(--len);opacity:0}}
.ed3{animation-name:ed3}
@keyframes ed4{0%{stroke-dashoffset:var(--len);opacity:0}56.0%{stroke-dashoffset:var(--len);opacity:0}56.4%{opacity:1}59.0%{stroke-dashoffset:0;opacity:1}84%{stroke-dashoffset:0;opacity:1}92%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:var(--len);opacity:0}}
.ed4{animation-name:ed4}
@media (prefers-reduced-motion:reduce){g[class^="st"],path[class^="ed"]{animation:none!important;opacity:1!important;stroke-dashoffset:0!important}}
</style>
</defs>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="800" y="48" text-anchor="middle" fill="#111827" font-size="30" font-weight="800">Creating a kbx dataset</text>
<text x="800" y="78" text-anchor="middle" fill="#6b7280" font-size="16">from an empty repository to a living, queryable knowledge base</text>
<text x="80" y="120" fill="#0d9488" font-size="14" font-weight="700" letter-spacing="2">PEOPLE · SURFACES</text>
<rect x="80" y="300" width="1440" height="280" rx="12" fill="url(#card)" stroke="#ddd6fe" stroke-width="1.5" filter="url(#cs)"/>
<text x="110" y="334" fill="#6d28d9" font-size="14" font-weight="700" letter-spacing="2.5">THE OVERLAY · kbx</text>
<text x="80" y="790" fill="#475569" font-size="14" font-weight="700" letter-spacing="2">HOST · SYSTEMS OF RECORD</text>
<path class="ed0" d="M309.0,205.0 L324.0,205.0" fill="none" stroke="#0d9488" stroke-width="2.2" stroke-opacity="0.75" marker-end="url(#m-human)" stroke-dasharray="17" style="--len:17"/>
<path class="ed1" d="M440.0,243.0 L440.0,441.0 Q440.0,455.0 454.0,455.0 L564.0,455.0" fill="none" stroke="#0d9488" stroke-width="2.2" stroke-opacity="0.75" marker-end="url(#m-human)" stroke-dasharray="366" style="--len:366"/>
<path class="ed2" d="M789.0,455.0 L804.0,455.0" fill="none" stroke="#7c3aed" stroke-width="2.2" stroke-opacity="0.75" marker-end="url(#m-kbx)" stroke-dasharray="17" style="--len:17"/>
<path class="ed3" d="M920.0,493.0 L920.0,666.0 Q920.0,680.0 934.0,680.0 L1044.0,680.0" fill="none" stroke="#7c3aed" stroke-width="2.2" stroke-opacity="0.75" marker-end="url(#m-kbx)" stroke-dasharray="341" style="--len:341"/>
<path class="ed4" d="M1160.0,642.0 L1160.0,219.0 Q1160.0,205.0 1174.0,205.0 L1284.0,205.0" fill="none" stroke="#64748b" stroke-width="2.2" stroke-opacity="0.75" marker-end="url(#m-host)" stroke-dasharray="591" style="--len:591"/>
<g class="st0">
<rect x="91.0" y="167.0" width="218.0" height="76" rx="10" fill="#ffffff" stroke="#0d9488" stroke-opacity="0.5" stroke-width="1.6" filter="url(#ss)"/>
<circle cx="91.0" cy="167.0" r="12.5" fill="url(#node)"/>
<text x="91.0" y="171.5" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">1</text>
<g fill="none" stroke="#0d9488" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform="translate(279.0,177.0) scale(0.8)"><circle cx="12" cy="8" r="3.2"/><path d="M5.5,19.5 a6.5,6.5 0 0 1 13,0"/></g>
<text x="105.0" y="193.0" fill="#111827" font-size="14" font-weight="600">Pick a starting point</text>
<text x="105.0" y="213.0" fill="#6b7280" font-size="12">empty repo, existing content,</text>
<text x="105.0" y="229.0" fill="#6b7280" font-size="12">or an existing manifest</text>
</g>
<g class="st1">
<rect x="331.0" y="167.0" width="218.0" height="76" rx="10" fill="#ffffff" stroke="#0d9488" stroke-opacity="0.5" stroke-width="1.6" filter="url(#ss)"/>
<circle cx="331.0" cy="167.0" r="12.5" fill="url(#node)"/>
<text x="331.0" y="171.5" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">2</text>
<g fill="none" stroke="#0d9488" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform="translate(519.0,177.0) scale(0.8)"><rect x="3" y="4.5" width="18" height="15" rx="2"/><polyline points="7,9.5 10,12 7,14.5"/><line x1="12" y1="15.5" x2="16.5" y2="15.5"/></g>
<text x="345.0" y="193.0" fill="#111827" font-size="14" font-weight="600">Run the guided init</text>
<text x="345.0" y="213.0" fill="#6b7280" font-size="12">CLI: npx kbexplorer init, or</text>
<text x="345.0" y="229.0" fill="#6b7280" font-size="12">plugin-brokered onboarding</text>
</g>
<g class="st2">
<rect x="571.0" y="409.0" width="218.0" height="92" rx="10" fill="#ffffff" stroke="#6d28d9" stroke-opacity="0.5" stroke-width="1.6" filter="url(#ss)"/>
<circle cx="571.0" cy="409.0" r="12.5" fill="url(#node)"/>
<text x="571.0" y="413.5" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">3</text>
<g fill="none" stroke="#6d28d9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform="translate(759.0,419.0) scale(0.8)"><circle cx="12" cy="12" r="3.2"/><path d="M12,4.5 v2.3 M12,17.2 v2.3 M4.5,12 h2.3 M17.2,12 h2.3 M6.7,6.7 l1.6,1.6 M15.7,15.7 l1.6,1.6 M17.3,6.7 l-1.6,1.6 M8.3,15.7 l-1.6,1.6"/></g>
<text x="585.0" y="435.0" fill="#111827" font-size="14" font-weight="600">Genesis state machine</text>
<text x="585.0" y="455.0" fill="#6b7280" font-size="12">template strategy · content</text>
<text x="585.0" y="471.0" fill="#6b7280" font-size="12">mode · visual identity ·</text>
<text x="585.0" y="487.0" fill="#6b7280" font-size="12">search mode</text>
</g>
<g class="st3">
<rect x="811.0" y="417.0" width="218.0" height="76" rx="10" fill="#ffffff" stroke="#6d28d9" stroke-opacity="0.5" stroke-width="1.6" filter="url(#ss)"/>
<circle cx="811.0" cy="417.0" r="12.5" fill="url(#node)"/>
<text x="811.0" y="421.5" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">4</text>
<g fill="none" stroke="#6d28d9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform="translate(999.0,427.0) scale(0.8)"><circle cx="6" cy="17.5" r="2.4"/><circle cx="12.5" cy="5.5" r="2.4"/><circle cx="18.5" cy="15" r="2.4"/><line x1="7.2" y1="15.4" x2="11.4" y2="7.6"/><line x1="13.7" y1="7.4" x2="17.4" y2="13"/><line x1="8.4" y1="17" x2="16.1" y2="15.4"/></g>
<text x="825.0" y="443.0" fill="#111827" font-size="14" font-weight="600">Generate the graph</text>
<text x="825.0" y="463.0" fill="#6b7280" font-size="12">sources → providers → engine</text>
<text x="825.0" y="479.0" fill="#6b7280" font-size="12">— pure KBGraph + manifest</text>
</g>
<g class="st4">
<rect x="1051.0" y="642.0" width="218.0" height="76" rx="10" fill="#ffffff" stroke="#475569" stroke-opacity="0.5" stroke-width="1.6" filter="url(#ss)"/>
<circle cx="1051.0" cy="642.0" r="12.5" fill="url(#node)"/>
<text x="1051.0" y="646.5" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">5</text>
<g fill="none" stroke="#475569" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform="translate(1239.0,652.0) scale(0.8)"><circle cx="6.5" cy="6" r="2.3"/><circle cx="6.5" cy="18" r="2.3"/><circle cx="17.5" cy="8" r="2.3"/><line x1="6.5" y1="8.3" x2="6.5" y2="15.7"/><path d="M6.5,14.5 C6.5,10.5 17.5,13.5 17.5,10.3"/></g>
<text x="1065.0" y="668.0" fill="#111827" font-size="14" font-weight="600">Commit the scaffold</text>
<text x="1065.0" y="688.0" fill="#6b7280" font-size="12">.kbx.json · content/ ·</text>
<text x="1065.0" y="704.0" fill="#6b7280" font-size="12">manifest · chosen template</text>
</g>
<g class="st5">
<rect x="1291.0" y="167.0" width="218.0" height="76" rx="10" fill="#ffffff" stroke="#0d9488" stroke-opacity="0.5" stroke-width="1.6" filter="url(#ss)"/>
<circle cx="1291.0" cy="167.0" r="12.5" fill="url(#node)"/>
<text x="1291.0" y="171.5" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">6</text>
<g fill="none" stroke="#0d9488" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform="translate(1479.0,177.0) scale(0.8)"><circle cx="12" cy="12" r="8.6"/><path d="M8,12.4 l2.8,2.8 5.3,-5.9"/></g>
<text x="1305.0" y="193.0" fill="#111827" font-size="14" font-weight="600">Verify &amp; explore</text>
<text x="1305.0" y="213.0" fill="#6b7280" font-size="12">doctor / preflight checks;</text>
<text x="1305.0" y="229.0" fill="#6b7280" font-size="12">open the canvas: a living KB</text>
</g>
<text x="800" y="862" text-anchor="middle" fill="#94a3b8" font-size="14">Genesis is a state machine, not a surface — the CLI, the plugin, and the canvas all render the same choices.</text>
</svg>