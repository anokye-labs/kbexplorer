<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" role="img" aria-labelledby="t d">
<title id="t">Hosting a kbx dataset</title>
<desc id="d">The dataset lives in git; a build on merge projects the graph into representations, deploys them to a static host, and surfaces serve people and agents.</desc>
<defs>
<linearGradient id="node" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
<linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#faf5ff"/><stop offset="1" stop-color="#f3f0ff"/></linearGradient>
<filter id="cs" x="-4%" y="-12%" width="108%" height="128%"><feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#6d28d9" flood-opacity="0.12"/></filter>
<filter id="ss" x="-12%" y="-24%" width="124%" height="156%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/></filter>
<marker id="m-human" viewBox="0 0 10 10" refX="6.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5,1 L8.5,5 L1.5,9" fill="none" stroke="#0d9488" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="m-kbx" viewBox="0 0 10 10" refX="6.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5,1 L8.5,5 L1.5,9" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="m-host" viewBox="0 0 10 10" refX="6.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5,1 L8.5,5 L1.5,9" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
g[class^="st"],path[class^="ed"]{animation-duration:16s;animation-timing-function:ease-in-out;animation-iteration-count:infinite}
g[class^="st"]{transform-box:fill-box;transform-origin:center}
@keyframes st0{0%{opacity:0;transform:scale(.6)}2.0%{opacity:0;transform:scale(.6)}4.2%{opacity:1;transform:scale(1)}84%{opacity:1;transform:scale(1)}92%{opacity:0;transform:scale(.6)}100%{opacity:0;transform:scale(.6)}}
.st0{animation-name:st0}
@keyframes st1{0%{opacity:0;transform:scale(.6)}16.7%{opacity:0;transform:scale(.6)}18.9%{opacity:1;transform:scale(1)}84%{opacity:1;transform:scale(1)}92%{opacity:0;transform:scale(.6)}100%{opacity:0;transform:scale(.6)}}
.st1{animation-name:st1}
@keyframes st2{0%{opacity:0;transform:scale(.6)}31.3%{opacity:0;transform:scale(.6)}33.5%{opacity:1;transform:scale(1)}84%{opacity:1;transform:scale(1)}92%{opacity:0;transform:scale(.6)}100%{opacity:0;transform:scale(.6)}}
.st2{animation-name:st2}
@keyframes st3{0%{opacity:0;transform:scale(.6)}46.0%{opacity:0;transform:scale(.6)}48.2%{opacity:1;transform:scale(1)}84%{opacity:1;transform:scale(1)}92%{opacity:0;transform:scale(.6)}100%{opacity:0;transform:scale(.6)}}
.st3{animation-name:st3}
@keyframes st4{0%{opacity:0;transform:scale(.6)}60.7%{opacity:0;transform:scale(.6)}62.9%{opacity:1;transform:scale(1)}84%{opacity:1;transform:scale(1)}92%{opacity:0;transform:scale(.6)}100%{opacity:0;transform:scale(.6)}}
.st4{animation-name:st4}
@keyframes ed0{0%{stroke-dashoffset:var(--len);opacity:0}9.3%{stroke-dashoffset:var(--len);opacity:0}9.7%{opacity:1}12.3%{stroke-dashoffset:0;opacity:1}84%{stroke-dashoffset:0;opacity:1}92%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:var(--len);opacity:0}}
.ed0{animation-name:ed0}
@keyframes ed1{0%{stroke-dashoffset:var(--len);opacity:0}24.0%{stroke-dashoffset:var(--len);opacity:0}24.4%{opacity:1}27.0%{stroke-dashoffset:0;opacity:1}84%{stroke-dashoffset:0;opacity:1}92%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:var(--len);opacity:0}}
.ed1{animation-name:ed1}
@keyframes ed2{0%{stroke-dashoffset:var(--len);opacity:0}38.7%{stroke-dashoffset:var(--len);opacity:0}39.1%{opacity:1}41.7%{stroke-dashoffset:0;opacity:1}84%{stroke-dashoffset:0;opacity:1}92%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:var(--len);opacity:0}}
.ed2{animation-name:ed2}
@keyframes ed3{0%{stroke-dashoffset:var(--len);opacity:0}53.3%{stroke-dashoffset:var(--len);opacity:0}53.7%{opacity:1}56.3%{stroke-dashoffset:0;opacity:1}84%{stroke-dashoffset:0;opacity:1}92%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:var(--len);opacity:0}}
.ed3{animation-name:ed3}
@media (prefers-reduced-motion:reduce){g[class^="st"],path[class^="ed"]{animation:none!important;opacity:1!important;stroke-dashoffset:0!important}}
</style>
</defs>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="800" y="48" text-anchor="middle" fill="#111827" font-size="30" font-weight="800">Hosting a kbx dataset</text>
<text x="800" y="78" text-anchor="middle" fill="#6b7280" font-size="16">one repository, many representations — served as a static site</text>
<text x="80" y="120" fill="#0d9488" font-size="14" font-weight="700" letter-spacing="2">PEOPLE · SURFACES</text>
<rect x="80" y="300" width="1440" height="280" rx="12" fill="url(#card)" stroke="#ddd6fe" stroke-width="1.5" filter="url(#cs)"/>
<text x="110" y="334" fill="#6d28d9" font-size="14" font-weight="700" letter-spacing="2.5">THE OVERLAY · kbx</text>
<text x="80" y="790" fill="#475569" font-size="14" font-weight="700" letter-spacing="2">HOST · SYSTEMS OF RECORD</text>
<path class="ed0" d="M334.0,680.0 L395.0,680.0" fill="none" stroke="#64748b" stroke-width="2.2" stroke-opacity="0.75" marker-end="url(#m-host)" stroke-dasharray="63" style="--len:63"/>
<path class="ed1" d="M512.0,642.0 L512.0,469.0 Q512.0,455.0 526.0,455.0 L683.0,455.0" fill="none" stroke="#64748b" stroke-width="2.2" stroke-opacity="0.75" marker-end="url(#m-host)" stroke-dasharray="388" style="--len:388"/>
