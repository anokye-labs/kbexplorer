<path class="ed3" d="M1088.0,642.0 L1088.0,219.0 Q1088.0,205.0 1102.0,205.0 L1259.0,205.0" fill="none" stroke="#64748b" stroke-width="2.2" stroke-opacity="0.75" marker-end="url(#m-host)" stroke-dasharray="638" style="--len:638"/>
<g class="st0">
<rect x="114.0" y="642.0" width="220.0" height="76" rx="10" fill="#ffffff" stroke="#475569" stroke-opacity="0.5" stroke-width="1.6" filter="url(#ss)"/>
<circle cx="114.0" cy="642.0" r="12.5" fill="url(#node)"/>
<text x="114.0" y="646.5" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">1</text>
<g fill="none" stroke="#475569" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform="translate(304.0,652.0) scale(0.8)"><circle cx="6.5" cy="6" r="2.3"/><circle cx="6.5" cy="18" r="2.3"/><circle cx="17.5" cy="8" r="2.3"/><line x1="6.5" y1="8.3" x2="6.5" y2="15.7"/><path d="M6.5,14.5 C6.5,10.5 17.5,13.5 17.5,10.3"/></g>
<text x="128.0" y="668.0" fill="#111827" font-size="14" font-weight="600">Dataset lives in git</text>
<text x="128.0" y="688.0" fill="#6b7280" font-size="12">content + manifest + search</text>
<text x="128.0" y="704.0" fill="#6b7280" font-size="12">index, versioned together</text>
</g>
<g class="st1">
<rect x="402.0" y="642.0" width="220.0" height="76" rx="10" fill="#ffffff" stroke="#475569" stroke-opacity="0.5" stroke-width="1.6" filter="url(#ss)"/>
<circle cx="402.0" cy="642.0" r="12.5" fill="url(#node)"/>
<text x="402.0" y="646.5" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">2</text>
<g fill="none" stroke="#475569" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform="translate(592.0,652.0) scale(0.8)"><circle cx="12" cy="12" r="3.2"/><path d="M12,4.5 v2.3 M12,17.2 v2.3 M4.5,12 h2.3 M17.2,12 h2.3 M6.7,6.7 l1.6,1.6 M15.7,15.7 l1.6,1.6 M17.3,6.7 l-1.6,1.6 M8.3,15.7 l-1.6,1.6"/></g>
<text x="416.0" y="668.0" fill="#111827" font-size="14" font-weight="600">Build on merge</text>
<text x="416.0" y="688.0" fill="#6b7280" font-size="12">a GitHub Actions workflow</text>
<text x="416.0" y="704.0" fill="#6b7280" font-size="12">runs generate on main</text>
</g>
<g class="st2">
<rect x="690.0" y="417.0" width="220.0" height="76" rx="10" fill="#ffffff" stroke="#6d28d9" stroke-opacity="0.5" stroke-width="1.6" filter="url(#ss)"/>
<circle cx="690.0" cy="417.0" r="12.5" fill="url(#node)"/>
<text x="690.0" y="421.5" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">3</text>
<g fill="none" stroke="#6d28d9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform="translate(880.0,427.0) scale(0.8)"><path d="M12,3.5 l8.5,4.7 -8.5,4.7 -8.5,-4.7 z"/><path d="M3.5,13.2 l8.5,4.7 8.5,-4.7"/><path d="M3.5,17.4 l8.5,4.7 8.5,-4.7"/></g>
<text x="704.0" y="443.0" fill="#111827" font-size="14" font-weight="600">Project the graph</text>
<text x="704.0" y="463.0" fill="#6b7280" font-size="12">spa · json-ld · llm-context</text>
<text x="704.0" y="479.0" fill="#6b7280" font-size="12">— one graph, many targets</text>
</g>
<g class="st3">
<rect x="978.0" y="642.0" width="220.0" height="76" rx="10" fill="#ffffff" stroke="#475569" stroke-opacity="0.5" stroke-width="1.6" filter="url(#ss)"/>
<circle cx="978.0" cy="642.0" r="12.5" fill="url(#node)"/>
<text x="978.0" y="646.5" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">4</text>
<g fill="none" stroke="#475569" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform="translate(1168.0,652.0) scale(0.8)"><circle cx="12" cy="12" r="8.6"/><path d="M12,16.5 v-8.5 M8.6,11.2 L12,7.8 l3.4,3.4"/></g>
<text x="992.0" y="668.0" fill="#111827" font-size="14" font-weight="600">Deploy the site</text>
<text x="992.0" y="688.0" fill="#6b7280" font-size="12">GitHub Pages — or any static</text>
<text x="992.0" y="704.0" fill="#6b7280" font-size="12">host; the host is decoupled</text>
</g>
<g class="st4">
<rect x="1266.0" y="167.0" width="220.0" height="76" rx="10" fill="#ffffff" stroke="#0d9488" stroke-opacity="0.5" stroke-width="1.6" filter="url(#ss)"/>
<circle cx="1266.0" cy="167.0" r="12.5" fill="url(#node)"/>
<text x="1266.0" y="171.5" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">5</text>
<g fill="none" stroke="#0d9488" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform="translate(1456.0,177.0) scale(0.8)"><circle cx="9" cy="8.5" r="2.8"/><path d="M3.5,19 a5.5,5.5 0 0 1 11,0"/><circle cx="16.5" cy="9.5" r="2.3"/><path d="M16.2,13.6 a5,5 0 0 1 4.6,5.4"/></g>
<text x="1280.0" y="193.0" fill="#111827" font-size="14" font-weight="600">Consume</text>
<text x="1280.0" y="213.0" fill="#6b7280" font-size="12">people browse, search, query;</text>
<text x="1280.0" y="229.0" fill="#6b7280" font-size="12">agents ground answers in it</text>
</g>
<text x="800" y="862" text-anchor="middle" fill="#94a3b8" font-size="14">GitHub-the-host is separable from git-the-store — Pages is a convenience, not a dependency.</text>
</svg>