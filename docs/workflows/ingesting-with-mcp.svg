@keyframes ed3{0%{stroke-dashoffset:var(--len);opacity:0}44.0%{stroke-dashoffset:var(--len);opacity:0}44.4%{opacity:1}47.0%{stroke-dashoffset:0;opacity:1}84%{stroke-dashoffset:0;opacity:1}92%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:var(--len);opacity:0}}
.ed3{animation-name:ed3}
@keyframes ed4{0%{stroke-dashoffset:var(--len);opacity:0}56.0%{stroke-dashoffset:var(--len);opacity:0}56.4%{opacity:1}59.0%{stroke-dashoffset:0;opacity:1}84%{stroke-dashoffset:0;opacity:1}92%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:var(--len);opacity:0}}
.ed4{animation-name:ed4}
@media (prefers-reduced-motion:reduce){g[class^="st"],path[class^="ed"]{animation:none!important;opacity:1!important;stroke-dashoffset:0!important}}
</style>
</defs>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="800" y="48" text-anchor="middle" fill="#111827" font-size="30" font-weight="800">Human-in-the-loop ingestion via MCP</text>
<text x="800" y="78" text-anchor="middle" fill="#6b7280" font-size="16">credentialed systems of record enter the graph only through a person</text>
<text x="80" y="120" fill="#0d9488" font-size="14" font-weight="700" letter-spacing="2">PEOPLE · SURFACES</text>
<rect x="80" y="300" width="1440" height="280" rx="12" fill="url(#card)" stroke="#ddd6fe" stroke-width="1.5" filter="url(#cs)"/>
<text x="110" y="334" fill="#6d28d9" font-size="14" font-weight="700" letter-spacing="2.5">THE OVERLAY · kbx</text>
<text x="80" y="790" fill="#475569" font-size="14" font-weight="700" letter-spacing="2">HOST · SYSTEMS OF RECORD</text>
<path class="ed0" d="M200.0,634.0 L200.0,219.0 Q200.0,205.0 214.0,205.0 L324.0,205.0" fill="none" stroke="#64748b" stroke-width="2.2" stroke-opacity="0.75" marker-end="url(#m-host)" stroke-dasharray="583" style="--len:583"/>
<path class="ed1" d="M549.0,205.0 L564.0,205.0" fill="none" stroke="#0d9488" stroke-width="2.2" stroke-opacity="0.75" marker-end="url(#m-human)" stroke-dasharray="17" style="--len:17"/>
<path class="ed2" d="M680.0,243.0 L680.0,441.0 Q680.0,455.0 694.0,455.0 L804.0,455.0" fill="none" stroke="#0d9488" stroke-width="2.2" stroke-opacity="0.75" marker-end="url(#m-human)" stroke-dasharray="366" style="--len:366"/>
<path class="ed3" d="M1029.0,455.0 L1044.0,455.0" fill="none" stroke="#7c3aed" stroke-width="2.2" stroke-opacity="0.75" marker-end="url(#m-kbx)" stroke-dasharray="17" style="--len:17"/>
<path class="ed4" d="M1160.0,417.0 L1160.0,219.0 Q1160.0,205.0 1174.0,205.0 L1284.0,205.0" fill="none" stroke="#7c3aed" stroke-width="2.2" stroke-opacity="0.75" marker-end="url(#m-kbx)" stroke-dasharray="366" style="--len:366"/>
<g class="st0">
<rect x="91.0" y="634.0" width="218.0" height="92" rx="10" fill="#ffffff" stroke="#475569" stroke-opacity="0.5" stroke-width="1.6" filter="url(#ss)"/>
<circle cx="91.0" cy="634.0" r="12.5" fill="url(#node)"/>
<text x="91.0" y="638.5" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">1</text>
<g fill="none" stroke="#475569" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform="translate(279.0,644.0) scale(0.8)"><path d="M17.3,18 H7.2 a4.3,4.3 0 1 1 .9,-8.5 a6,6 0 0 1 11.3,1.9 a3.4,3.4 0 0 1 -2.1,6.6 z"/></g>
<text x="105.0" y="660.0" fill="#111827" font-size="14" font-weight="600">Knowledge elsewhere</text>
<text x="105.0" y="680.0" fill="#6b7280" font-size="12">Teams · SharePoint ·</text>
<text x="105.0" y="696.0" fill="#6b7280" font-size="12">Confluence · Drive —</text>
<text x="105.0" y="712.0" fill="#6b7280" font-size="12">credentialed SoRs</text>
</g>
<g class="st1">
<rect x="331.0" y="167.0" width="218.0" height="76" rx="10" fill="#ffffff" stroke="#0d9488" stroke-opacity="0.5" stroke-width="1.6" filter="url(#ss)"/>
<circle cx="331.0" cy="167.0" r="12.5" fill="url(#node)"/>
<text x="331.0" y="171.5" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">2</text>
<g fill="none" stroke="#0d9488" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform="translate(519.0,177.0) scale(0.8)"><circle cx="8" cy="8" r="3.6"/><line x1="10.6" y1="10.6" x2="20" y2="20"/><line x1="15.5" y1="15.5" x2="17.6" y2="13.4"/><line x1="18.2" y1="18.2" x2="20.3" y2="16.1"/></g>
<text x="345.0" y="193.0" fill="#111827" font-size="14" font-weight="600">Connect an MCP server</text>
<text x="345.0" y="213.0" fill="#6b7280" font-size="12">bring-your-own credentials;</text>
<text x="345.0" y="229.0" fill="#6b7280" font-size="12">kbx never holds them</text>
</g>
<g class="st2">
<rect x="571.0" y="167.0" width="218.0" height="76" rx="10" fill="#ffffff" stroke="#0d9488" stroke-opacity="0.5" stroke-width="1.6" filter="url(#ss)"/>
<circle cx="571.0" cy="167.0" r="12.5" fill="url(#node)"/>
<text x="571.0" y="171.5" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">3</text>
<g fill="none" stroke="#0d9488" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform="translate(759.0,177.0) scale(0.8)"><path d="M12,3.2 l7,2.8 v6 c0,4.4 -3,7.4 -7,8.8 c-4,-1.4 -7,-4.4 -7,-8.8 v-6 z"/><path d="M9,11.5 l2.1,2.1 4,-4.4"/></g>
<text x="585.0" y="193.0" fill="#111827" font-size="14" font-weight="600">Consent + cost</text>
<text x="585.0" y="213.0" fill="#6b7280" font-size="12">what will be read and what</text>
<text x="585.0" y="229.0" fill="#6b7280" font-size="12">it costs — before anything runs</text>
</g>
<g class="st3">
<rect x="811.0" y="409.0" width="218.0" height="92" rx="10" fill="#ffffff" stroke="#6d28d9" stroke-opacity="0.5" stroke-width="1.6" filter="url(#ss)"/>
<circle cx="811.0" cy="409.0" r="12.5" fill="url(#node)"/>
<text x="811.0" y="413.5" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">4</text>
<g fill="none" stroke="#6d28d9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform="translate(999.0,419.0) scale(0.8)"><circle cx="6" cy="17.5" r="2.4"/><circle cx="12.5" cy="5.5" r="2.4"/><circle cx="18.5" cy="15" r="2.4"/><line x1="7.2" y1="15.4" x2="11.4" y2="7.6"/><line x1="13.7" y1="7.4" x2="17.4" y2="13"/><line x1="8.4" y1="17" x2="16.1" y2="15.4"/></g>
<text x="825.0" y="435.0" fill="#111827" font-size="14" font-weight="600">Provider ingests</text>
<text x="825.0" y="455.0" fill="#6b7280" font-size="12">resources → nodes + edges;</text>
<text x="825.0" y="471.0" fill="#6b7280" font-size="12">access labels + provenance</text>
<text x="825.0" y="487.0" fill="#6b7280" font-size="12">carry over</text>
</g>
<g class="st4">
<rect x="1051.0" y="417.0" width="218.0" height="76" rx="10" fill="#ffffff" stroke="#6d28d9" stroke-opacity="0.5" stroke-width="1.6" filter="url(#ss)"/>
<circle cx="1051.0" cy="417.0" r="12.5" fill="url(#node)"/>
<text x="1051.0" y="421.5" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">5</text>
<g fill="none" stroke="#6d28d9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform="translate(1239.0,427.0) scale(0.8)"><path d="M7,3.5 h7 l4,4 v13 h-11 z"/><path d="M14,3.5 v4 h4"/><line x1="9.5" y1="12" x2="15.5" y2="12"/><line x1="9.5" y1="15.5" x2="15.5" y2="15.5"/></g>
<text x="1065.0" y="443.0" fill="#111827" font-size="14" font-weight="600">Change-set staged</text>
<text x="1065.0" y="463.0" fill="#6b7280" font-size="12">nothing lands directly —</text>
<text x="1065.0" y="479.0" fill="#6b7280" font-size="12">ingestion is a proposal</text>
</g>
<g class="st5">
<rect x="1291.0" y="167.0" width="218.0" height="76" rx="10" fill="#ffffff" stroke="#0d9488" stroke-opacity="0.5" stroke-width="1.6" filter="url(#ss)"/>
<circle cx="1291.0" cy="167.0" r="12.5" fill="url(#node)"/>
<text x="1291.0" y="171.5" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">6</text>
<g fill="none" stroke="#0d9488" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform="translate(1479.0,177.0) scale(0.8)"><circle cx="6.5" cy="6" r="2.3"/><circle cx="6.5" cy="18" r="2.3"/><circle cx="17.5" cy="18" r="2.3"/><line x1="6.5" y1="8.3" x2="6.5" y2="15.7"/><path d="M10.5,6 h3 a4,4 0 0 1 4,4 v5.7"/></g>
<text x="1305.0" y="193.0" fill="#111827" font-size="14" font-weight="600">Review → PR → merge</text>
<text x="1305.0" y="213.0" fill="#6b7280" font-size="12">the person is the approval</text>
<text x="1305.0" y="229.0" fill="#6b7280" font-size="12">gate; the corpus follows</text>
</g>
<text x="800" y="862" text-anchor="middle" fill="#94a3b8" font-size="14">The person is the credential boundary and the approval gate — ingestion is proposed, never assumed.</text>
</svg>