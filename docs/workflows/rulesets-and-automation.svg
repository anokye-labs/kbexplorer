 x1="14.6" y1="14.6" x2="20" y2="20"/></g><text x="1305.0" y="193.0" fill="#111827" font-size="14" font-weight="600">Audit — don't assume</text><text x="1305.0" y="213.0" fill="#6b7280" font-size="12">verify the live ruleset:</text><text x="1305.0" y="229.0" fill="#6b7280" font-size="12">gh api …/rules/branches/main</text></g><text x="800" y="862" text-anchor="middle" fill="#94a3b8" font-size="14">The host enforces; kbx declares. Protection is verified against the live repo — never assumed from docs.</text></svg>