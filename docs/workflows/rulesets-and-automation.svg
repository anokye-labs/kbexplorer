cy="642.0" r="12.5" fill="url(#node)"/><text x="331.0" y="646.5" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">2</text><g fill="none" stroke="#475569" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform="translate(519.0,652.0) scale(0.8)"><path d="M7,3.5 h7 l4,4 v13 h-11 z"/><path d="M14,3.5 v4 h4"/><line x1="9.5" y1="12" x2="15.5" y2="12"/><line x1="9.5" y1="15.5" x2="15.5" y2="15.5"/></g><text x="345.0" y="668.0" fill="#111827" font-size="14" font-weight="600">Trace to an issue</text><text x="345.0" y="688.0" fill="#6b7280" font-size="12">every PR refs a typed issue</text><text x="345.0" y="704.0" fill="#6b7280" font-size="12">(Epic / Feature / Task / Bug)</text></g><g class="st2"><rect x="571.0" y="642.0" width="218.0" height="76" rx="10" fill="#ffffff" stroke="#475569" stroke-opacity="0.5" stroke-width="1.6" filter="url(#ss)"/><circle cx="571.0" cy="642.0" r="12.5" fill="url(#node)"/><text x="571.0" y="646.5" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">3</text><g fill="none" stroke="#475569" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform="translate(759.0,652.0) scale(0.8)"><circle cx="12" cy="12" r="3.2"/><path d="M12,4.5 v2.3 M12,17.2 v2.3 M4.5,12 h2.3 M17.2,12 h2.3 M6.7,6.7 l1.6,1.6 M15.7,15.7 l1.6,1.6 M17.3,6.7 l-1.6,1.6 M8.3,15.7 l-1.6,1.6"/></g><text x="585.0" y="668.0" fill="#111827" font-size="14" font-weight="600">Actions gate the PR</text><text x="585.0" y="688.0" fill="#6b7280" font-size="12">build · integrity audit ·</text><text x="585.0" y="704.0" fill="#6b7280" font-size="12">drift gates · linked issue</text></g><g class="st3"><rect x="811.0" y="417.0" width="218.0" height="76" rx="10" fill="#ffffff" stroke="#6d28d9" stroke-opacity="0.5" stroke-width="1.6" filter="url(#ss)"/><circle cx="811.0" cy="417.0" r="12.5" fill="url(#node)"/><text x="811.0" y="421.5" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">4</text><g fill="none" st