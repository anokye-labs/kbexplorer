5.5 0 0 1 11,0"/><circle cx="16.5" cy="9.5" r="2.3"/><path d="M16.2,13.6 a5,5 0 0 1 4.6,5.4"/></g><text x="1305.0" y="193.0" fill="#111827" font-size="14" font-weight="600">Query</text><text x="1305.0" y="213.0" fill="#6b7280" font-size="12">results resolve to graph</text><text x="1305.0" y="229.0" fill="#6b7280" font-size="12">nodes with kg:// identity</text></g><text x="800" y="862" text-anchor="middle" fill="#94a3b8" font-size="14">A stale index is a CI failure, not a mystery — the corpus and the content move in the same commit.</text></svg>